apiVersion: v1
kind: Service
metadata:
  name: gojet
  namespace: gojet
  labels:
    app.kubernetes.io/name: gojet
    app.kubernetes.io/part-of: gojet
spec:
  # Minikube 学习环境使用 NodePort，便于通过 minikube service gojet -n gojet 访问。
  type: NodePort
  selector:
    app.kubernetes.io/name: gojet
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gojet
  namespace: gojet
  labels:
    app.kubernetes.io/name: gojet
    app.kubernetes.io/part-of: gojet
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gojet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gojet
        app.kubernetes.io/part-of: gojet
    spec:
      containers:
        - name: gojet
          # 在 Minikube 中构建镜像后使用该名称：
          # eval $(minikube docker-env) && docker build -t gojet:latest .
          image: gojet:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: gojet-config
            - secretRef:
                name: gojet-secret
          readinessProbe:
            # 该接口会检查数据库连通性，适合作为就绪探针。
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            # 存活探针只检查端口，避免数据库短暂抖动导致应用被重启。
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

