  name: gojet-secret
  namespace: gojet
  labels:
    app.kubernetes.io/name: gojet
type: Opaque
stringData:
  # 学习环境可以先使用这些值；生产环境请改成强密码。
  DB_USER: "zhou"
  DB_PASSWORD: "password_"
  POSTGRES_DB: "gojet"
  POSTGRES_USER: "zhou"
  POSTGRES_PASSWORD: "password_"

  # 建议替换为 openssl rand -base64 64 生成的随机字符串。
  JWT_SECRET: "todo-change-this-jwt-secret"

