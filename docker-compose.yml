# Docker Compose for Production Environment
# Usage: docker-compose up --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gojet
    ports:
      - "8080:8080"
    environment:
      - APP_PORT=8080
      - APP_MODE=release  # 生产环境使用release模式
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=zhou
      - DB_PASSWORD=password_
      - DB_NAME=gojet
      - DB_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - LOG_LEVEL=info  # 生产环境使用info级别
      - LOG_OUTPUT=both  # 同时输出到控制台和文件
      - LOG_FILE_PATH=/root/logs/app.log
    volumes:
      - ./config:/root/config:ro
      - ./logs/app:/root/logs  # 应用日志持久化挂载
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - gojet-network

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      - POSTGRES_DB=gojet
      - POSTGRES_USER=zhou
      - POSTGRES_PASSWORD=password_
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhou -d gojet"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./logs/postgres:/var/log/postgresql
    command:
      - postgres
      - -c
      - logging_collector=on
      - -c
      - log_destination=stderr
      - -c
      - log_directory=/var/log/postgresql
      - -c
      - log_filename=postgresql-%Y-%m-%d.log
      - -c
      - log_rotation_age=1d
      - -c
      - log_rotation_size=10MB
    restart: unless-stopped
    networks:
      - gojet-network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./logs/redis:/data/logs
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --logfile
      - /data/logs/redis.log
    restart: unless-stopped
    networks:
      - gojet-network

volumes:
  postgres_data:
  redis_data:

networks:
  gojet-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
